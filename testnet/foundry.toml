# Generic EVM logic tests only; real Monad estimates come from chain 10143 RPC.
[profile.default]
src = "../contracts"
test = "../tests/contracts-testnet"
out = "../.localbackend/cp19-build/out"
cache_path = "../.localbackend/cp19-build/cache"
libs = ["../node_modules"]
remappings = ["@openzeppelin/contracts/=../node_modules/@openzeppelin/contracts/"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
chain_id = 10143
