<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MealForward · V3 测试网部署</title>
<style>body{max-width:820px;margin:48px auto;padding:0 24px;background:#f7f6f0;color:#24382a;font:17px/1.7 system-ui}h1{font-size:30px}button{padding:12px 20px;margin:8px 12px 8px 0;border:0;border-radius:8px;background:#294f3c;color:white;font-size:16px;cursor:pointer}button:disabled{opacity:.45;cursor:default}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:white;padding:20px;border-radius:12px;font-size:14px}input{width:96%;padding:12px;font:14px monospace}#status{font-weight:600}small{color:#56665a}</style>
<h1>MealForward V3 测试网部署</h1>
<p>创建独立的 V3 合约：任何人可触发到期结算，款项固定支付原商家。不会充值餐款、迁移数据或修改旧合约。本页不接收私钥。</p>
<p>在 MetaMask 中选择部署钱包，并切换到 Monad Testnet（10143）。核对下方角色和费用后，由你亲自确认。</p>
<pre id="review">正在核对链上状态…</pre>
<button id="connect">连接 MetaMask</button><button id="refresh">重新核对</button><button id="deploy" disabled>部署新合约（打开 MetaMask 确认）</button>
<p id="status" role="status"></p>
<h2>恢复原部署交易</h2><p>已有交易或结果未知时只查询原交易，不再次部署。交易 Hash 可在 MetaMask 活动记录中找到。</p>
<input id="hash" aria-label="原部署交易 Hash" placeholder="0x…"><button id="verify">核验原交易</button>
<pre id="result" hidden></pre><small>部署并不代表新版网站已上线；公开清单仍须人工审核后登记；还需连接服务并完成公网验收。</small>
<script type="module" src="/client.mjs"></script></html>
