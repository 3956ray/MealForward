name: MealForward T1-F Owner/Donor EIP191 + EIP712 typed practice (NO RELEASE)
on:
  push:
    branches:
      - codex/mealforward-t1f-phase4-owner-donor-proof-20261025
      - codex/mealforward-t1f-phase5-release-hold-hardening-20261025
      - codex/mealforward-phase5-metamask-v4-domain-fix-20261026
      - codex/mealforward-t1e-issuer-original-tx-verifier-20261023
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  owner-donor-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Require canonical HANDOFF at project root
        run: |
          test -s HANDOFF.md
          grep -q '强制每轮交接更新规范' HANDOFF.md
      - name: Install pinned test dependencies, no install scripts
        working-directory: t1-intents
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Syntax check original and new isolated proof modules
        working-directory: t1-intents
        run: |
          node --check t1f-phase4-proof.mjs
          node --check t1e-role-proof-server.mjs
          node --check t1f-phase4-proof.test.mjs
          node --check t1f-phase5-typed-practice.mjs
          node --check t1f-phase5-typed-practice.test.mjs
          node --check t1f-phase5-metamask-v4-domain.test.mjs
          node --check public/t1f-phase5.mjs
          node --check public/t1f-phase4.mjs
      - name: Real test EIP191 signatures and negative security HTTP gates
        working-directory: t1-intents
        run: |
          node --test t1f-phase4-proof.test.mjs
          node --test t1f-phase5-typed-practice.test.mjs
          node --test t1f-phase5-metamask-v4-domain.test.mjs
          node --test t1e-role-proof-server.test.mjs
          node --test t1e-wallet-roles.test.mjs
      - name: Ensure independent Role Proof never signs/approves/transfers or opens original financial operations
        working-directory: t1-intents
        run: |
          for f in t1f-phase4-proof.mjs public/t1f-phase4.mjs; do
            if grep -E 'eth_sendTransaction|eth_sendRawTransaction|eth_signTypedData_v4|wallet_sendCalls|privateKeyToAccount|Wallet.fromPrivateKey|localStorage|sessionStorage' "$f"; then
              echo PHASE4_EIP191_ONLY_SOURCE_VIOLATION
              exit 1
            fi
          done
          # EIP-712 practice REQUIRES eth_signTypedData_v4 on user click.
          # Unlike real Recovery Release, it must never send chain writes.
          for f in t1f-phase5-typed-practice.mjs public/t1f-phase5.mjs; do
            if grep -E 'eth_sendTransaction|eth_sendRawTransaction|wallet_sendCalls|privateKeyToAccount|Wallet.fromPrivateKey|localStorage|sessionStorage' "$f"; then
              echo PHASE5_EIP712_PRACTICE_CHAIN_SENDER_VIOLATION
              exit 1
            fi
          done
