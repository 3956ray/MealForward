name: MealForward T1-E separate real Render staging HTTPS - no auth or claim
# Historical safety gate for SETUP_ONLY. The same dedicated service has
# now progressed to CLAIM_SIWE_ONLY and the new SIWE-only cloud smoke runs
# automatically. Do not rerun the obsolete SETUP_ONLY expectation on push.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  public-real-https:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Staging source public URL is pinned and cannot accept a host argument
        working-directory: t1-intents
        run: |
          node --check t1e-claim-cloud-setup-smoke.mjs
          if grep -E 'eth_sendTransaction|eth_sendRawTransaction|privateKeyToAccount' t1e-claim-cloud-setup-smoke.mjs; then
            exit 1
          fi
      - name: Actual Render 15 URL GET and safe negative POST, no secrets
        working-directory: t1-intents
        run: node t1e-claim-cloud-setup-smoke.mjs
