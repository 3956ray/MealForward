name: MealForward T1-E separate real Render staging HTTPS - no auth or claim
on:
  push:
    branches:
      - codex/mealforward-t1e-recipient-claim-http-20261023
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  public-real-https:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Staging source public URL is pinned and cannot accept a host argument
        working-directory: t1-intents
        run: |
          node --check t1e-claim-cloud-setup-smoke.mjs
          if grep -E 'eth_sendTransaction|eth_sendRawTransaction|privateKeyToAccount' t1e-claim-cloud-setup-smoke.mjs; then
            exit 1
          fi
      - name: Actual Render 15 URL GET and safe negative POST, no secrets
        working-directory: t1-intents
        run: node t1e-claim-cloud-setup-smoke.mjs
