name: MealForward Monad read-only Vercel pilot preview gate
on:
  push:
    branches:
      - codex/mealforward-monad-deployment-proof-20261019
  pull_request:
    paths:
      - "pilot/**"
permissions:
  contents: read
jobs:
  static-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install isolated static preview dependencies
        working-directory: pilot
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Fail closed if PREEXISTING readonly root page can sign or transact
        working-directory: pilot
        run: node --test tests/readonly.test.mjs
      - name: Build Vite read-only preview
        working-directory: pilot
        run: npm run build
      - name: Check readonly root output and no hidden server write endpoints
        run: |
          test -s pilot/dist/index.html
          test -s pilot/dist/deploy-t0.html
          test ! -d pilot/api
          if grep -E "eth_sendRawTransaction|eth_sendTransaction|eth_signTypedData" pilot/index.html; then
            echo "FAILED: root readonly wallet preflight contains a signing method"
            exit 1
          fi
          # The separate /deploy-t0.html intentionally contains exactly ONE
          # user-initiated Deploy; the dedicated T0 CI proves its own boundaries.
      - uses: actions/upload-artifact@v4
        with:
          name: mealforward-monad-readonly-preview
          path: pilot/dist
          retention-days: 7
