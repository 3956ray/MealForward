name: MealForward T1-F independent issuer key proof and one-original Issue no-send receipt gate
on:
  push:
    branches:
      - codex/mealforward-t1f-issuer-control-and-issuance-20261023
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  issuer-protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install exact EVM, MetaMask and PG dependencies without lifecycle scripts
        working-directory: t1-intents
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Fail closed on syntax, missing local ethers or wallet write methods
        working-directory: t1-intents
        run: |
          npm run check
          test -s node_modules/ethers/dist/ethers.umd.min.js
          test -s public/t1f-issuer-proof.html
          node --check t1f-issuer-control.mjs
          node --check public/t1f-issuer-proof-ui.mjs
          node --check t1f-issue-operation.mjs
          if grep -E 'eth_sendTransaction|eth_sendRawTransaction|eth_signTypedData_v4|wallet_sendCalls|privateKeyToAccount' public/t1f-issuer-proof-ui.mjs t1f-issuer-control.mjs t1f-issue-operation.mjs; then
            echo "T1F_ISSUER_PROOF_MUST_NEVER_SEND_CHAIN_TRANSACTIONS"
            exit 1
          fi
      - name: Real disposable EIP191 MetaMask vectors and one-original Issue protocol with fake receipts
        working-directory: t1-intents
        run: node --test t1f-issuer-control.test.mjs t1f-issue-operation.test.mjs t1f-issuer-page.test.mjs static-fetch-policy.test.mjs t1e-recipient-consent.test.mjs
      - name: Read original funded first Unit and simulate original Issuer issue only
        working-directory: t1-intents
        run: node t1e-first-issue-readiness.mjs
