name: MealForward G1 signed public publisher outbox
on:
  push:
    branches:
      - codex/mealforward-g1-source-publisher-outbox-20261018
  pull_request:
    paths:
      - "cp30-backend/g1-export/**"
      - ".github/workflows/cp31-g1-source-publisher-pg17.yml"
permissions:
  contents: read
jobs:
  source-outbox:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MF_G1_SOURCE_DISPOSABLE_ONLY: ack-three-standalone-pg17
      OUTBOX_DATABASE_URL: postgres://postgres:g1-source-ci-only@127.0.0.1:5435/mealforward_g1_source_ci_only
      ANCHOR_CACHE_DATABASE_URL: postgres://postgres:g1-anchored-cache-ci-only@127.0.0.1:5434/mealforward_g1_anchor_cache_ci_only
      ANCHOR_DATABASE_URL: postgres://postgres:g1-anchor-ci-only@127.0.0.1:5433/mealforward_g1_anchor_ci_only
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Create isolated G1 publisher, receiver cache and independent anchor PG17
        run: |
          docker run -d --rm --name mf-g1-source-outbox-ci \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=g1-source-ci-only \
            -e POSTGRES_DB=mealforward_g1_source_ci_only \
            -p 127.0.0.1:5435:5432 postgres:17.11
          docker run -d --rm --name mf-g1-source-cache-ci \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=g1-anchored-cache-ci-only \
            -e POSTGRES_DB=mealforward_g1_anchor_cache_ci_only \
            -p 127.0.0.1:5434:5432 postgres:17.11
          docker run -d --rm --name mf-g1-source-anchor-ci \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=g1-anchor-ci-only \
            -e POSTGRES_DB=mealforward_g1_anchor_ci_only \
            -p 127.0.0.1:5433:5432 postgres:17.11
          for container in mf-g1-source-outbox-ci mf-g1-source-cache-ci mf-g1-source-anchor-ci; do
            for i in $(seq 1 40); do
              if docker exec "$container" pg_isready -U postgres; then break; fi
              sleep 1
            done
            docker exec "$container" pg_isready -U postgres
          done
      - name: Install pinned public-source PostgreSQL client
        run: |
          cd cp30-backend/g1-export
          npm install --ignore-scripts --no-audit --no-fund
      - name: Check source-only issuer, roles and signed-envelope syntax
        run: |
          cd cp30-backend/g1-export
          node --check source-publisher.mjs
          node --check source-publisher-transport.mjs
          node --check source-publisher-pg.test.mjs
          node --check independent-anchor.mjs
          node --check public-cache.mjs
      - name: Test real PostgreSQL signed publisher outbox and remote anchor
        run: |
          cd cp30-backend/g1-export
          node --test public-envelope.test.mjs source-publisher-pg.test.mjs source-publisher-transport.test.mjs
