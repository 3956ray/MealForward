name: MealForward T1-F immutable one-Unit issuer Issue protocol (NO broadcast)
on:
  push:
    branches:
      - codex/mealforward-t1f-original-issue-recovery-20261023
  workflow_dispatch:
permissions:
  contents: read
jobs:
  issue-protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Require complete canonical Agent HANDOFF before closing work
        run: |
          test -s HANDOFF.md
          grep -q 'Agent 一读即接手' HANDOFF.md
          grep -q '强制每轮交接更新规范' HANDOFF.md
          grep -q '不可犯的错误' HANDOFF.md
      - name: Install pinned dependencies with no install scripts
        working-directory: t1-intents
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Check first Issue immutable claim and wallet-only receipt source
        working-directory: t1-intents
        run: |
          node --check t1f-issue-operation.mjs
          node --test t1f-issue-operation.test.mjs
          node --test t1e-first-issue-readiness.test.mjs
          node --check t1f-issue-ledger.mjs
          node --check t1f-issuer-http.mjs
          node --check t1e-claim-server.mjs
          node --check t1e-claim-http.mjs
          node --check t1e-claim-entrypoint.mjs
          node --check t1f-issuer-live-smoke.mjs
          node --check testnet-readonly-rpc.mjs
          node --test t1e-claim-http.test.mjs
          node --test t1f-issuer-http.test.mjs
          node --test t1f-issuer-page.test.mjs
          node --test t1f-static-query.test.mjs
          node --check public/t1f-issuer.mjs
          node --check t1f-issuer-http.mjs

  original-issue-pg17:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITHUB_ACTIONS: "true"
      MF_T1E_DISPOSABLE_ONLY: ack-fresh-t1e-pg17
      MF_T1F_DISPOSABLE_ONLY: ack-fresh-t1f-pg17
      DATABASE_URL: postgres://postgres:t1e-disposable-only@127.0.0.1:5436/postgres
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Start fresh one-off PostgreSQL17 ONLY on loopback 5436
        run: |
          docker run -d --rm --name t1f-issuer-disposable-pg17 \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=t1e-disposable-only \
            -e POSTGRES_DB=postgres \
            -p 127.0.0.1:5436:5432 postgres:17.11
          for i in $(seq 1 40); do
            if docker exec t1f-issuer-disposable-pg17 pg_isready -U postgres -d postgres; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Install pinned PostgreSQL and ethers libraries
        working-directory: t1-intents
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Test exact 009–012 SQL with nonce permanence and role-isolation
        working-directory: t1-intents
        run: |
          node --check t1f-issue-ledger.ci.mjs
          node t1f-issue-ledger.ci.mjs
