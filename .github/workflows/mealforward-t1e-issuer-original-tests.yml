name: MealForward T1-E issuer original receipt no-broadcast acceptance
on:
  push:
    branches:
      - codex/mealforward-t1e-issuer-original-tx-verifier-20261023
  workflow_dispatch:
permissions:
  contents: read
jobs:
  issuer-receipt-negative-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install reviewed pinned test-only dependencies
        working-directory: t1-intents
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Reject any new broadcaster or private key flow
        working-directory: t1-intents
        run: |
          node --check t1e-issuer-original.mjs
          node --check t1e-issuer-original.test.mjs
          if grep -E 'eth_sendTransaction|eth_sendRawTransaction|privateKeyToAccount|sendRawTransaction\(' t1e-issuer-original.mjs; then
            exit 1
          fi
      - name: Original EVM calldata, nonce, UNKNOWN, receipt and forged event regression
        working-directory: t1-intents
        run: node --test t1e-issuer-original.test.mjs
