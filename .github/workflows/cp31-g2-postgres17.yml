name: MealForward G2 SQL Source
on:
  push:
    branches:
      - codex/mealforward-g2-pg17-disposable-ci-20261017
permissions:
  contents: read
jobs:
  g2-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate pinned migration source
        run: python -B cp30-backend/tools/live-runtime-hotfix-parity-source-check.py
