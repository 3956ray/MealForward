name: MealForward G2 disposable PostgreSQL 17 SQL parity
on:
  push:
    branches:
      - codex/mealforward-g2-pg17-disposable-ci-20261017
  pull_request:
    paths:
      - "cp30-backend/migrations/**"
      - "cp30-backend/connection-migrations/**"
      - "cp30-backend/tools/g2-disposable-pg17-ci.py"
      - ".github/workflows/cp31-g2-postgres17.yml"
permissions:
  contents: read
jobs:
  fresh-pg17:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: gha-disposable-test-postgres-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MF_G2_DISPOSABLE_ONLY: ack-fresh-gha-postgres-17
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGDATABASE: postgres
      PGPASSWORD: gha-disposable-test-postgres-only
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile disposable test runner (never import original startup)
        run: python -B -m py_compile cp30-backend/tools/g2-disposable-pg17-ci.py
      - name: Install isolated PostgreSQL adapter dependency
        run: python -m pip install --disable-pip-version-check --no-input --only-binary=:all: "psycopg[binary]==3.3.6"
      - name: Verify tightly scoped SQL 045 source delta
        run: python -B cp30-backend/tools/live-runtime-hotfix-parity-source-check.py
      - name: Apply source-owned 001–045 to temporary PostgreSQL 17 and verify catalog grants
        run: python -B cp30-backend/tools/g2-disposable-pg17-ci.py
