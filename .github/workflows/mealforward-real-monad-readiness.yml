name: MealForward Monad Testnet real read-only readiness
on:
  push:
    branches:
      - codex/mealforward-real-monad-e2e-preflight-20261018
      - codex/mealforward-monad-deployment-proof-20261019
permissions:
  contents: read
jobs:
  monad-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify live Monad Testnet chain and Circle USDC (GET-state calls only)
        run: node staging-d1/monad-live-rpc-preflight.mjs
      # The legacy Cloudflare D1 Worker currently does NOT serve /chain-check.
      # Its separate public smoke must not be silently reported as PASS for this preview.
      - name: Legacy Cloudflare D1 deployed-site smoke (older branch only)
        if: github.ref == 'refs/heads/codex/mealforward-real-monad-e2e-preflight-20261018'
        run: node staging-d1/smoke-live.mjs
