name: MealForward T1-E live protected SIWE_ONLY HTTPS gate (zero funds, zero claims)
on:
  push:
    branches:
      - codex/mealforward-t1e-recipient-claim-http-20261023
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  live-readonly-siwe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check public smoke source without connecting to secrets
        working-directory: t1-intents
        run: |
          node --check t1e-claim-siwe-cloud-smoke.mjs
          # The smoke test intentionally CONTAINS rejection literals for
          # eth_sendTransaction and eth_sendRawTransaction. Scan actual
          # server/browser application code, not assertion source.
          for source in t1e-claim-server.mjs t1e-claim-http.mjs public/t1e-claim.mjs; do
            if grep -E 'eth_sendTransaction|eth_sendRawTransaction|privateKeyToAccount' "$source"; then
              echo 'T1E_CLAIM_APP_IMPLICIT_BROADCAST_METHOD_FORBIDDEN'
              exit 1
            fi
          done
      - name: Actual Render HTTPS private SIWE and zero-write gate
        working-directory: t1-intents
        run: node t1e-claim-siwe-cloud-smoke.mjs
