name: MealForward T1-C real public Render no-funds HTTPS attestation
on:
  push:
    branches:
      - codex/mealforward-t1c-supabase-render-readonly-20261022
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-real-render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify actual Render endpoint (NO credentials, money or wallet)
        run: node t1-intents/cloud-readonly-smoke.mjs
