name: MealForward CP31 frontend regression
on:
  push:
    branches:
      - codex/mealforward-resume-selected-meal-20261016
  pull_request:
    paths:
      - "sites-frontend/**"
      - ".github/workflows/cp31-frontend-regression.yml"
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check syntax
        run: |
          node --check sites-frontend/dist/app.js
          node --check sites-frontend/dist/live-api.mjs
          node --check sites-frontend/dist/onboarding-view.mjs
      - name: Run isolated CP31 regressions
        run: |
          cd sites-frontend
          node --test login-meal-resume.test.mjs onboarding-wallet.test.mjs live-api.test.mjs live-support.test.mjs live-claim.test.mjs live-redemption.test.mjs live-settlement.test.mjs support-ui.test.mjs claim-ui.test.mjs verification-ui.test.mjs settlement-ui.test.mjs meal-publish-ui.test.mjs ledger-view.test.mjs
